<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="An example of the library bottom zig">
    <meta name="keywords" content="library, bottom zig, zig library">
    <meta name="author" content="Deecellar">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Example of bottom-zig online</title>
    <!--- We preload our wasm-->
    <link rel="preload" href="wasm/bottom-zig.wasm">
    <link rel="stylesheet" href="css/output.css">
  </head>
  <body class="dark:bg-gray-700 bg-gray-50 dark:text-gray-200">
    <div class="container mx-auto">
      <div class="flex flex-col items-center">
        <div class="flex-1">
          <h1 class="text-center text-3xl font-bold ">Example of bottom-zig online</h1>
          <h2 class="text-center text-xl">
            This is a simple example on the bottom-zig library.
          </h2>
        </div>
        <!-- We make a form with 2 text boxes and a button in between -->
        <div class="flex-1">
          <div class="flex flex-col items-center">
            <div class="flex-1 align-middle justify-center">
              <!-- Input box for encoded/decoded text-->
              <textarea type="text" required class="border border-gray-400  p-2 w-full m-2 dark:border-blue-500 dark:bg-gray-600 dark:text-gray-300" id="text" placeholder="Enter text here"></textarea>
              <!-- Buttons for Bottomify, regress and swap result and input boxes-->
              <div class="flex flex-row items-stretch ml-4 ">
                <button class="border border-gray-400 p-2 m-2 w-32 text-md  dark:border-blue-500" id="bottomify">Bottomify</button>
                <button class="border border-gray-400 p-2 m-2 w-32 text-md dark:border-blue-500" id="regress">Regress</button>
                <button class="border border-gray-400 p-2 m-2 w-32 text-md max-w-full  dark:border-blue-500" id="swap">Swap</button>
              </div>
              <!-- Result box for encoded/decoded text-->
              <textarea type="text" class="border border-gray-400 m-3 dark:border-blue-500 dark:bg-slate-600 dark:text-gray-300 p-2 w-full" id="result" placeholder="Result" disabled></textarea>
            </div>
          </div>
        </div>
      </div>
      <!-- Progress indicator for large file processing -->
      <div class="flex flex-col items-center">
        <div class="flex-1 w-full max-w-2xl">
          <div id="progress" class="hidden">
            <div class="bg-blue-500 dark:bg-blue-800 text-white font-bold p-2 m-2 rounded-lg">
              <p class="text-center" id="progress-text">Processing...</p>
              <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mt-2">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Just a normal alert notification when things go wrong-->
      <div class="flex flex-col items-center">
        <div class="flex-1">
          <div id="alert" aria-live="assertive">
            <div class="bg-red-500 dark:bg-red-800 text-white dark:text-graw-100 font-bold p-2 m-2 rounded-lg">
              <p class="text-center">Something went wrong!</p>
              <p class="sr-only">You have written something incorrectly in the input box with the following
                            message</p>
              <noscript>This page does not work without wasm or javascript activated</noscript>
              <div id="extra">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    const alert = document.getElementById("alert");
    alert.classList.add("hidden");
    const extra = document.getElementById("extra");
    const progress = document.getElementById("progress");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    // We hide our alert box at the beginning
    // We define the buttons and the input boxes
    const text = document.getElementById("text");
    const result = document.getElementById("result");
    const bottomify = document.getElementById("bottomify");
    const regress = document.getElementById("regress");
    const swap = document.getElementById("swap");
    // On unhandled exceptions we show the alert box with the error message
    window.addEventListener("unhandledrejection", function (event) {
        alert.classList.remove("hidden");
        extra.appendChild(document.createTextNode(event.reason));
    });
    
    if (typeof WebAssembly === "undefined") {
        alert.classList.remove("hidden");
        extra.innerHTML = "Your browser does not support or have disabled WebAssembly. See if your Browser support wasm at: https://caniuse.com/wasm";
    }
    else {
        (async () => {
            // We load the wasm module at wasm/bottom-zig.wasm with the promise/then method
            var obj = null;
            var response = await fetch("wasm/bottom-zig.wasm");
            var wasm = await response.arrayBuffer();
            // Reuse TextDecoder for better performance
            const utf8Decoder = new TextDecoder();
            function readString(addr, len) {
                let view = new Uint8Array(obj.instance.exports.memory.buffer);
                return utf8Decoder.decode(view.slice(addr, addr + len));
            }
            // Reuse TextEncoder for better performance
            const utf8Encoder = new TextEncoder();

            function startWasm() {
                const {
                    encode,
                    decode,
                    encodeStart,
                    encodeChunk,
                    encodeFinish,
                    decodeStart,
                    decodeChunk,
                    decodeFinish,
                    _start,
                    getInputBuffer,
                    getInputBufferSize
                } = obj.instance.exports;
                _start();

                // Get the input buffer location once
                const inputBufferPtr = getInputBuffer();
                const inputBufferSize = getInputBufferSize();

                /// Process input in chunks because large data doesn't fit in single buffer
                function processChunked(startFn, chunkFn, finishFn) {
                    const inputText = text.value;
                    const encoded = utf8Encoder.encode(inputText);

                    // Use single-shot API for small inputs to avoid overhead
                    if (encoded.length <= inputBufferSize) {
                        const view = new Uint8Array(obj.instance.exports.memory.buffer);
                        view.set(encoded, inputBufferPtr);
                        return startFn === encodeStart ? encode() : decode();
                    }

                    // Show progress indicator for large inputs
                    progress.classList.remove("hidden");
                    alert.classList.add("hidden");

                    try {
                        startFn();

                        const totalChunks = Math.ceil(encoded.length / inputBufferSize);
                        let offset = 0;
                        let chunkIndex = 0;

                        while (offset < encoded.length) {
                            const chunkSize = Math.min(inputBufferSize, encoded.length - offset);
                            const chunk = encoded.slice(offset, offset + chunkSize);

                            const view = new Uint8Array(obj.instance.exports.memory.buffer);
                            view.set(chunk, inputBufferPtr);

                            const errorCode = chunkFn(chunkSize);
                            if (errorCode !== 0) {
                                alert.classList.remove("hidden");
                                extra.innerHTML = `Processing failed at byte ${offset} (error code ${errorCode})`;
                                progress.classList.add("hidden");
                                return;
                            }

                            offset += chunkSize;
                            chunkIndex++;

                            // Update progress bar
                            const percentComplete = (chunkIndex / totalChunks) * 100;
                            progressBar.style.width = `${percentComplete}%`;
                            progressText.textContent = `Processing chunk ${chunkIndex}/${totalChunks}...`;
                        }

                        finishFn();
                    } finally {
                        // Hide progress bar when done
                        progress.classList.add("hidden");
                        progressBar.style.width = "0%";
                    }
                }

                // we set encode and decode to the buttons
                bottomify.addEventListener("click", () => {
                    processChunked(encodeStart, encodeChunk, encodeFinish);
                });
                regress.addEventListener("click", () => {
                    processChunked(decodeStart, decodeChunk, decodeFinish);
                });
                swap.addEventListener("click", () => {
                    // We swap the input and result boxes
                    let temp = text.value;
                    text.value = result.value;
                    result.value = temp;
                });
            }
            var env = {
                env: {
                    memoryBase: 0,
                    tableBase: 0,
                    memory: new WebAssembly.Memory({
                        initial: 96,
                        maximum: 128
                    }),
                    setResult: (ptr, len) => {
                        document.getElementById("result").value = readString(ptr, len);
                    },
                    appendResult: (ptr, len) => {
                        document.getElementById("result").value += readString(ptr, len);
                    },
                    getText: () => {
                        // Deprecated: kept for compatibility but no longer used
                        return 0;
                    },
                    getTextLen: () => {
                        let text = document.getElementById("text").value;
                        let textLen = utf8Encoder.encode(text);
                        return textLen.length;
                    },
                    appendException: (ptr, len) => {
                        let result = new Uint8Array(obj.instance.exports.memory.buffer, ptr, len);
                        // We append the result as a new paragraph in the alert box
                        extra.appendChild(document.createElement("p")).innerHTML = readString(ptr, len);
                        // we show the alert box
                        alert.classList.remove("hidden");

                    },
                    hideException: () => {
                        alert.classList.add("hidden");
                        // we clear the alert box
                        extra.innerHTML = "";
                    },
                    logus: (ptr, len) => {
                        let result = new Uint8Array(obj.instance.exports.memory.buffer, ptr, len);
                        console.log(readString(ptr, len));
                    },
                    restart: (state) => {
                        (async () => {


                            obj = await WebAssembly.instantiate(wasm, env);
                            startWasm();

                            if (state === 1) {
                                extra.appendChild(document.createElement("p")).innerHTML = "The text is too large to encode";                                                                
                            }
                            else if (state === 2) {
                                extra.appendChild(document.createElement("p")).innerHTML = "The text is too large to decode";
                            }
                            else {
                                extra.appendChild(document.createElement("p")).innerHTML = "Error when erroring, no memory!";
                            }
                            alert.classList.remove("hidden");
                        })().catch(e => {
                            alert.classList.remove("hidden");
                            extra.innerHTML = e;
                        });
                    }
                }
            };
            obj = await WebAssembly.instantiate(wasm, env);
            // We restart our wasm module on uncaught runtime errors


            startWasm();

        })().catch(e => {
            alert.classList.remove("hidden");
            extra.innerHTML = e;
        });

    }
  </script>
</html>
